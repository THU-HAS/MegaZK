[package]
name = "boojum"
version = "0.2.0"
edition = "2021"

[dependencies]
derivative = "2"
serde = { version = "1", features = ["derive"] }
rand = "0.8.5"
unroll = "0.1"
num_cpus = "1"
rayon = "=1.10.0"
smallvec = { version = "=1.13.2", features = ["const_generics", "const_new", "serde"] }
crossbeam = "0.8.4"
sha3 = { git = "https://github.com/RustCrypto/hashes.git", rev = "7a187e934c1f6c68e4b4e5cf37541b7a0d64d303" }
lazy_static = "1.5.0"
arrayvec = "0.7"
const_format = "0.2"
bincode = "1.3.3"
ethereum-types = "=0.14.1"
cs_derive = { path = "./cs_derive" }
itertools = "0.11.0"
blake2 = "0.10"
sha2 = "0.10"
num-modular = "0.5.1"
packed_simd = { version = "0.3.9" }
pairing = { package = "pairing_ce", git = "https://github.com/matter-labs/pairing.git", rev = "e86029c163fe25719712be0fc0b981e2536f5034" }
crypto-bigint = "0.5"
convert_case = "0.6.0"
firestorm = "0.5.1"
tracing = { version = "0.1.37", optional = true }

[dev-dependencies]
criterion = "0.5.1"
serde_json = "1.0.132"
hex = "0.4.3"

[[bench]]
name = "benchmarks"
harness = false

[features]
log_tracing = ["tracing"]
