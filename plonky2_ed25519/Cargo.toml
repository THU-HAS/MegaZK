[package]
name = "plonky2_ed25519"
description = "Plonky2 implementation of Ed25519"
authors = ["Utsav Jain <utsav@atomlabs.one>"]
keywords = ["snark", "plonky2", "Ed25519"]
categories = ["cryptography"]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[features]
default = []
gpu = ["plonky2/gpu", "dep:cudart"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
plonky2 = "0.1.4"
plonky2-gpu-bench = { path = "../plonky2-gpu-bench" }
plonky2_crypto = {path = "../plonky2-crypto/"}
plonky2_sha512 = { package = "plonky2_sha512_gadget", path = "../plonky2_sha512/"}
curve25519-dalek = { git = "https://github.com/Electron-Labs/curve25519-dalek", rev = "fd71e1a4f0f36a7e3590177e999ca72b9c41ba42"}
itertools = { version = "0.11.0", default-features = false, features = ["use_alloc"] }
num = { version = "0.4", default-features = false, features = ["alloc", "rand"] }
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = "1.0.132"
anyhow = "1.0.40"
rand = "0.8.5"
sha2 = "0.10"
cudart = { path = "../era-cuda/cudart", optional = true }
structopt = "0.3"
