[package]
name = "neural-zkp"
version = "0.1.0"
edition="2021"
license = "MIT"
description = "A bunch of helpful ligence and zero knowledge"
repository = "https://github.com/dcbuild3r/proto-neural-zkp/"
readme = "README.md"
keywords = ["zero knowledge", "ML", "neural network"]
categories = ["cryptography tooling"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
bench = [ "criterion", "proptest" ]
gpu = ["plonky2/gpu", "dep:cudart"]

[[bin]]
name = "rust-app"
path = "src/cli/main.rs"

[[bench]]
name = "criterion"
harness = false
path = "criterion.rs"
required-features = [ "bench", "proptest" ]

[dependencies]
anyhow = "1.0.53"
auto_impl = "1.0.1"
bytesize = "1.1.0"
color-eyre = "0.6"
criterion = { version = "0.5.1", optional = true, features = [ "async_tokio" ] }
erased-serde = "0.3"
eyre = "0.6"
futures = "0.3"
itertools = "0.11.0"
mimalloc = { version = "0.1", default-features = false, optional = true }
num_cpus = "1.13"
once_cell = "1.8"
proptest = { version = "1.0", optional = true }
rand = "0.8.5"
rand_pcg = "0.3.1"
rayon = "=1.10.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.132"
serde_cbor = "0.11.1"
structopt = "0.3"
thiserror = "1.0"
tokio = { version = "1.15", features = [ "signal", "macros", "rt", "sync", "time", "rt-multi-thread", "tracing" ] }
tracing = "0.1"
tracing-futures = "0.2"
tracing-log = "0.1.2"
tracing-subscriber = { version = "0.3", features = [ "env-filter", "json" ] }
tracing-test = "0.2"
log = "0.4.14"
ndarray = {version = "0.15.4", features = ["serde"]}
ndarray-rand = "0.14.0"
ndarray-stats = " 0.5.0"
rand_isaac = "0.3.0"
plonky2 = "0.1.4"
plonky2-gpu-bench = { path = "../plonky2-gpu-bench" }
cudart = { path = "../era-cuda/cudart", optional = true }

[dev-dependencies]
proptest = { version = "1.0" }
tempfile = "3.0"

[build-dependencies]
eyre = "0.6"
time = { version = "=0.3.12", features = [ "formatting", "parsing" ] }
