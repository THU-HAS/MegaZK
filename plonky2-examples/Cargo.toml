[package]
name = "plonky2-examples"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[features]
default = []
gpu = ["plonky2/gpu", "dep:cudart"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
plonky2 = { version = "0.1.4" }
plonky2_ecdsa = {path = "../plonky2-ecdsa"}
plonky2-gpu-bench = { path = "../plonky2-gpu-bench" }
anyhow = { version = "1.0.40", default-features = false }
cudart = { path = "../era-cuda/cudart", optional = true }
rand = "0.8.5"
structopt = "0.3"
