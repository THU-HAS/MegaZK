[package]
name = "plonky2_sha256"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[features]
default = []
gpu = ["plonky2/gpu", "dep:cudart"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
plonky2 = { version = "0.1.4" }
plonky2-gpu-bench = { path = "../plonky2-gpu-bench" }
plonky2_crypto = {path = "../plonky2-crypto"}
anyhow = { version = "1.0.40", default-features = false }
rand = { version = "0.8.5", default-features = false }
keccak-hash = "0.10.0"
itertools = "0.11.0"
log = "0.4.14"
sha2 = "0.10"
env_logger = "0.10.0"
cudart = { path = "../era-cuda/cudart", optional = true }
structopt = "0.3"
